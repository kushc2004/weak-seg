# Multi-label classifier training (naive CAM and SEAM share the architecture).
cls_crop_size: 448
cls_resize_long: [448, 768]
cls_batch_size: 8
cls_lr: 0.01
cls_momentum: 0.9
cls_weight_decay: 0.0005
cls_epochs_plain: 15
cls_epochs_seam: 30     # SEAM losses need more steps on the small train split
cls_head_lr_mult: 10.0
cls_num_workers: 4
cls_scale_factor: 0.3   # equivariant downscale factor (SEAM recipe)
max_steps_per_epoch: null
